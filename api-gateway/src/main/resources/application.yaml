spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ---------- User Service (public: register + login) ----------
        - id: user-service-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/register,/api/v1/users/login

        # ---------- User Service (protected) ----------
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JWTAuthFilter

        # ---------- Market Data Service ----------
        - id: market-data-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/market/**
          filters:
            - name: JWTAuthFilter

        # ---------- Market WebSocket ----------
        - id: market-websocket
          uri: http://localhost:8082
          predicates:
            - Path=/ws/**
          filters:
            - name: JWTAuthFilter

        # ---------- Order Service ----------
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: JWTAuthFilter

        # ---------- Portfolio Service ----------
        - id: portfolio-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/portfolio/**
          filters:
            - name: JWTAuthFilter

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info